name: Daily Momentum Strategy Runner

on:
  schedule:
    - cron: '15 10 * * 1-5'  # Runs Mon-Fri at 10:15 AM UTC (3:45 PM IST)
  workflow_dispatch:          # Enables manual execution via GitHub UI

jobs:
  run-strategy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Daily Strategy
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: Commit Updated Portfolio State & Logs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/portfolio_state.json data/trade_log.csv data/equity_history.csv
          git commit -m "Auto-update portfolio state & logs [skip ci]" || exit 0
          git push
